document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#948c7e;line-height:1.3\">{{ f.label }}</span></div>\n                      <div style=\"font-size:19px;font-weight:700;letter-spacing:-.02em;color:{{ f.tone }}\">{{ f.value }}</div>\n                      <sc-if value=\"{{ f.hasSub }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:#6e675b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ f.sub }}</div></sc-if>\n                    </button>\n                  </sc-for>\n                </div>\n              </div>\n            </sc-if>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:34px\">\n              <div style=\"background:#ffffff;border:1px solid rgba(30,26,18,.1);border-radius:12px;padding:16px 18px\"><div style=\"font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#948c7e\">Documents</div><div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:7px\">{{ statDocs }}</div></div>\n              <div style=\"background:#ffffff;border:1px solid rgba(30,26,18,.1);border-radius:12px;padding:16px 18px\"><div style=\"font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#948c7e\">Collections</div><div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:7px\">{{ statColls }}</div></div>\n              <div style=\"background:#ffffff;border:1px solid rgba(30,26,18,.1);border-radius:12px;padding:16px 18px\"><div style=\"font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#948c7e\">En retard</div><div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:7px;color:{{ overdueColor }}\">{{ statOverdue }}</div></div>\n              <div style=\"background:#ffffff;border:1px solid rgba(30,26,18,.1);border-radius:12px;paddin ceholder-count=\"2\">\n                <button onclick=\"{{ g.open }}\" style=\"position:relative;text-align:left;background:#ffffff;border:1px solid rgba(30,26,18,.1);border-radius:12px;padding:18px;cursor:pointer;color:#211d17;overflow:hidden\" style-hover=\"border-color:{{ g.border }};background:#faf7f0\">\n                  <div style=\"position:absolute;inset:0;background:radial-gradient(140px 90px at 100% 0%, {{ g.soft }}, transparent 70%);pointer-events:none\"></div>\n                  <div style=\"width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:{{ g.soft }};margin-bottom:14px;position:relative\">{{ g.iconEl }}</div>\n                  <div style=\"font-weight:600;font-size:15.5px;position:relative\">{{ g.label }}</div>\n                  <div style=\"font-size:12.5px;color:#6e675b;margin-top:3px;position:relative\">{{ g.desc }}</div>\n                </button>\n              </sc-for>\n            </div>\n\n            <sc-if value=\"{{ hasRecent }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a79e8f;margin-bottom:14px\">Récemment ajoutés</div>\n              <sc-for list=\"{{ recent }}\" as=\"x\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ x.open }}\" style=\"display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 15px;margin-bottom:8px;background:#fbf8f2;border:1px solid rgba(30,26,18,.08);border-radius:12px;cursor:pointer;color:#211d17\" style-hover=\"background:#faf7f0;border-color:rgba(30,26,18,.13)\">\n                  <div style=\"width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;background:{{ x.soft }}\">{{ x.iconEl }}</div>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ x.title }}</div><div style=\"font-size:12px;color:#6e675b;margin-top:1px\">{{ x.collLabel }} · {{ x.typeLabel }}</div></div>\n                  <div style=\"color:#a79e8f;flex:none;display:flex\">{{ chevIcon }}</div>\n                </button>\n              </sc-for>\n            </sc-if>\n\n            <sc-if value=\"{{ isEmptyAll }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;padding:50px 20px;background:#faf7f0;border:1px dashed rgba(30,26,18,.14);border-radius:12px\">\n                <div style=\"margin-bottom:16px;display:flex;justify-content:center\">{{ emptyIcon }}</div>\n                <div style=\"font-weight:600;font-size:18px\">Rien encore, et c'est normal.</div>\n                <div style=\"color:#6e675b;font-size:14px;margin-top:7px;max-width:380px;margin-left:auto;margin-right:auto\">Ajoute ton premier document — Écrin garde tout à sa place et te prévient avant chaque échéance.</div>\n                <button onclick=\"{{ openAdd }}\" style=\"margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#262019,#15120d);color:#f4f1ea;border:0;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer\">{{ addIcon }}Ajouter un document</button>\n              </div>\n            </sc-if>\n          </div>\n        </sc-if>\n\n        <sc-if value=\"{{ isSearch }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:ecrFade .3s ease both\">\n            <div style=\"font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px\">Recherche</div>\n            <div style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.05em;color:#6e675b;margin-bottom:22px\">{{ searchCount }}</div>\n            <sc-if value=\"{{ searchEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;padding:46px;color:#6e675b\">Aucun document ne correspond. Essaie un autre mot.</div>\n            </sc-if>\n            <sc value=\"{{ doc.hasHolder }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,26,18,.07)\"><span style=\"color:#6e675b;font-size:13.5px\">Titulaire</span><span style=\"font-size:14px;font-weight:500;text-align:right\">{{ doc.holder }}</span></div></sc-if>\n              <sc-if value=\"{{ doc.hasNumber }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,26,18,.07)\"><span style=\"color:#6e675b;font-size:13.5px\">Numéro / référence</span><span style=\"font-family:'Geist Mono',monospace;font-size:13.5px;text-align:right\">{{ doc.number }}</span></div></sc-if>\n              <sc-if value=\"{{ doc.hasExp }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,26,18,.07)\"><span style=\"color:#6e675b;font-size:13.5px\">Échéance</span><span style=\"font-size:14px;font-weight:500;text-align:right\">{{ doc.expiryDate }}</span></div></sc-if>\n              <sc-if value=\"{{ doc.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:15px 0\"><div style=\"color:#6e675b;font-size:13.5px;margin-bottom:6px\">Note</div><div style=\"font-size:14px;line-height:1.6;color:#2a261e\">{{ doc.note }}</div></div></sc-if>\n              <sc-if value=\"{{ doc.bare }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:18px 0;color:#948c7e;font-size:13.5px;text-align:center\">Pas d'infos supplémentaires. Tu peux en ajouter en modifiant.</div></sc-if>\n            </div>\n\n            <div style=\"display:flex;gap:11px\">\n              <button onclick=\"{{ editDoc }}\" style=\"display:inline-flex;align-items:center;gap:8px;background:#f4efe7;border:1px solid rgba(30,26,18,.14);color:#211d17;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer\"      <div style=\"display:flex;gap:11px;flex-wrap:wrap\">\n                <button onclick=\"{{ changeName }}\" style=\"background:#f4efe7;border:1px solid rgba(30,26,18,.14);color:#211d17;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer\" style-hover=\"border-color:{{ accentBorder }}\">Changer de prénom</button>\n                <button onclick=\"{{ resetDemo }}\" style=\"background:#f4efe7;border:1px solid rgba(30,26,18,.14);color:#211d17;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer\" style-hover=\"border-color:rgba(179,137,47,.45)\">Recharger les exemples</button>\n                <button onclick=\"{{ clearAll }}\" style=\"background:transparent;border:1px solid rgba(30,26,18,.11);color:#6e675b;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer\" style-hover=\"color:#d2553c;border-color:rgba(210,85,60,.45)\">Tout effacer</button>\n              </div>\n            </div>\n          </div>\n        </sc-if>\n\n      </div>\n      </sc-if>\n\n      <sc-if value=\"{{ isCB }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:26px 26px 80px;animation:ecrRise .36s ease both\">\n          <button onclick=\"{{ gotoHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#6e675b;cursor:pointer;font-size:13.5px;padding:0;margin-bottom:16px\" style-hover=\"color:#211d17\">{{ backIcon }}Accueil</button>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:22px\">\n            <div style=\"width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;background:{{ finMeta.soft }}\">{{ finMeta.iconEl }}</div>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.05\">{{ finMeta.label }}</div><div style=\"color:#6e675b;font-size:14px;margin-top:2px\">{{ finMeta.desc }}</div></div>\n          </div>\n          <div id=\"cb-host\"></div>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{ isInv }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:26px 26px 80px;animation:ecrRise .36s ease both\">\n          <button onclick=\"{{ gotoHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#6e675b;cursor:pointer;font-size:13.5px;padding:0;margin-bottom:16px\" style-hover=\"color:#211d17\">{{ backIcon }}Accueil</button>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:22px\">\n            <div style=\"width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;background:{{ finMeta.soft }}\">{{ finMeta.iconEl }}</div>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.05\">{{ finMeta.label }}</div><div style=\"color:#6e675b;font-size:14px;margin-top:2px\">{{ finMeta.desc }}</div></div>\n          </div>\n          <div id=\"inv-host\"></div>\n        </div>\n      </sc-if>\n\n    </div>\n  </div>\n\n  <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ cancelForm }}\" style=\"position:fixed;inset:0;background:rgba(28,24,17,.4);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;animation:ecrFade .18s ease both\">\n      <div onclick=\"{{ stop }}\" style=\"width:100%;max-width:540px;max-height:88vh;overflow-y:auto;background:#ffffff;border:1px solid rgba(30,26,18,.14);border-radius:12px;box-shadow:0 50px 120px -40px rgba(40,33,20,.16);animation:ecrPop .24s cubic-bezier(.2,.7,.2,1) both\">\n\n        <sc-if value=\"{{ formPicker }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:24px 24px 26px\">\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.02em\">Quel document ?</div>\n            <div style olor:#6e675b;margin:0 0 6px\">Nom du document</label>\n            <input value=\"{{ draftTitle }}\" onchange=\"{{ setField }}\" data-field=\"title\" placeholder=\"{{ formMeta.titlePh }}\" style=\"width:100%;background:#f6f2ea;border:1px solid rgba(30,26,18,.13);color:#211d17;border-radius:12px;padding:11px 13px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(179,137,47,.5)\">\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <div><label style=\"display:block;font-size:12.5px;color:#6e675b;margin:15px 0 6px\">Titulaire</label><input value=\"{{ draftHolder }}\" onchange=\"{{ setField }}\" data-field=\"holder\" placeholder=\"ex. Camille\" style=\"width:100%;background:#f6f2ea;border:1px solid rgba(30,26,18,.13);color:#211d17;border-radius:12px;padding:11px 13px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(179,137,47,.5)\"></div>\n              <div><label style=\"display:block;font-size:12.5px;color:#6e675b;margin:15px 0 6px\">Numéro / référence</label><input value=\"{{ draftNumber }}\" onchange=\"{{ setField }}\" data-field=\"number\" placeholder=\"ex. 19FR84021\" style=\"width:100%;background:#f6f2ea;border:1px solid rgba(30,26,18,.13);color:#211d17;border-radius:12px;padding:11px 13px;font-size:14px;outline:none\" style-focus=\"border-color:rgba(179,137,47,.5)\"></div>\n            </div>\n\n            <label style=\"display:block;font-size:12.5px;color:#6e675b;margin:15px 0 6px\">Échéance <span style=\"color:#a79e8f\">— Écrin te préviendra avant</span></label>\n            <input value=\"{{ draftExpiry }}\" onchange=\"{{ setField }}\" data-field=\"expiry\" type=\"date\" style=\"width:100%;background:#f6f2ea;border:1px solid rgba(30,26,18,.13);color:#211d17;border-radius:12px;padding:11px 13px;font-size:14px;outline:none;color-scheme:dark\" style-focus=\"border-color:rgba(179,137,47,.5)\">\n\n            <label style=\"display:block;font-size:12.5px;color:#6e675b;margin:15px 0 6px\">Note</label>\n            <textarea value=\"{{ draftNote }}\" onchange=\"{{ setField }}\" data-field=\"note\" placeholder=\"Où il se trouve, un détail à retenir…\" style=\"width:100%;min-height:74px;resize:vertical;background:#f6f2ea;border:1px solid rgba(30,26,18,.13);color:#211d17;border-radius:12px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit\" style-focus=\"border-color:rgba(179,137,47,.5)\"></textarea>\n\n            <div style=\"display:flex;gap:11px;margin-top:22px\">\n              <button onclick=\"{{ cancelForm }}\" style=\"flex:1;background:#f4efe7;border:1px solid rgba(30,26,18,.13);color:#211d17;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"border-color:rgba(30,26,18,.2)\">Annuler</button>\n              <button onclick=\"{{ saveForm }}\" style=\"flex:1;background:linear-gradient(180deg,#262019,#15120d);color:#f4f1ea;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer\" style-hover=\"filter:brightness(1.06)\">{{ formMeta.saveLabel }}</button>\n            </div>\n          </div>\n        </sc-if>\n\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ welcome }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:radial-gradient(720px 440px at 50% 6%, {{ welcomeAccentSoft }}, transparent 62%), #f4f1ea;display:flex;align-items:center;justify-content:center;padding:24px;z-index:80;animation:ecrFade .25s ease both\">\n      <div style=\"width:100%;max-width:430px;text-align:center\">\n        <div style=\"width:74px;height:74px;border-radius:22px;margin:0 auto 26px;display:grid;place-items:center;background:{{ welcomeAccentSoft }};border:1px solid {{ welcomeAccentBorder }};font-size:34px;font-weight:800;color:{{ welcomeAccent }}\">{{ welcomeInitial }}</div>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:{{ welcomeAccent }};margin-bottom:14px;white-space:nowrap\">Toute ta vie, au même endroit</div>\n        <div style=\"font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05\">Comment t'appelles-tu ?</div>\n        <div style=\"color:#6e675b;font-size:15px;margin-top:11px;margin-bottom:26px\">Ton espace prend ton prénom — et ses couleurs. Tu pourras le changer quand tu veux.</div>\n        <input value=\"{{ nameDraft }}\" onchange=\"{{ setNameDraft }}\" onkeydown=\"{{ onNameKey }}\" placeholder=\"Ton prénom\" style=\"width:100%;text-align:center;background:#fff;border:1px solid rgba(30,26,18,.14);color:#211d17;border-radius:12px;padding:14px 16px;font-size:18px;outline:none;font-family:inherit\" style-focus=\"border-color:{{ welcomeAccentBorder }}\">\n        <button onclick=\"{{ submitName }}\" style=\"margin-top:14px;width:100%;background:#1e1b16;color:#f4f1ea;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#2a261e\">Entrer dans mon espace</button>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#f4efe7;border:1px solid rgba(30,26,18,.14);color:#211d17;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 22px 50px -20px rgba(40,33,20,.16);z-index:60;animation:ecrRise .25s ease both\">{{ toastCheck }}{{ toast }}</div>\n  </sc-if>\n\n</sc-if>\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view:'home', collId:null, docId:null, form:null, q:'', toast:null, loaded:false, nameDraft:'', welcome:false };\n\n  KEY = 'ecrin.app.v1';\n  IDKEY = 'ecrin.identity.v1';   // ECRIN: clé d'identité unifiée, lue par les 3 domaines\n\n  COLLS = [\n    {id:'identite', label:'Identité',          accent:'#2b6cd9', icon:'identite'},\n    {id:'sante',    label:'Santé',             accent:'#d2553c', icon:'sante'},\n    {id:'logement', label:'Logement',          accent:'#1f8a5b', icon:'logement'},\n    {id:'vehicule', label:'Véhicule',          accent:'#b9810f', icon:'vehicule'},\n    {id:'argent',   label:'Travail & argent',  accent:'#7a4fb5', icon:'argent'},\n    {id:'famille',  label:'Famille & vie',     accent:'#c0508f', icon:'famille'},\n  ];\n\n  // ECRIN: les deux outils finance, devenus des domaines natifs du socle.\n  FIN = [\n    {id:'cb',  label:'Comptes & Budget', accent:'#1f8a5b', icon:'wallet', desc:'Soldes, transactions, budget'},\n    {id:'inv', label:'Investissement',   accent:'#b3892f', icon:'gem',    desc:'Profil, fiscalité, portefeuille'},\n  ];\n\n  TYPE_GROUPS = [\n    {collId:'identite', types:[['passeport','Passeport'],['cni','Carte d’identité'],['permis','Permis de conduire'],['sejour','Titre de séjour']]},\n    {collId:'sante',    types:[['vitale','Carte Vitale'],['mutuelle','Mutuelle'],['ordonnance','Ordonnance'],['vaccin','Carnet de vaccination']]},\n    {collId:'logement', types:[['bail','Bail / location'],['asshab','Assurance habitation'],['energie','Facture d’énergie'],['quittance','Quittance de loyer']]},\n    {collId:'vehicule', types:[['grise','Carte grise'],['assauto','Assurance auto'],['ct','Contrôle technique'],['constat','Constat / sinistre']]},\n    {collId:'argent',   types:[['travail','Contrat de travail'],['paie','Fiche de paie'],['rib','RIB'],['impots','Avis d’imposition'],['assvie','Assurance vie']]},\n    {collId:'famille',  types:[['naissance','Acte de naissance'],['livret','Livret de famille'],['mariage','Contrat de mariage'],['testament','Testament']]},\n  ];\n\n  ICONS = {\n    home:'M3 10.6 12 3l9 7.6|M5.4 9.3V20h13.2V9.3|M9.8 20v-6h4.4v6',\n    identite:'M3 5.5h18v13H3z|M8 12.2a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2|M5.4 16.4c.5-1.9 1.8-2.7 2.6-2.7s2.1.8 2.6 2.7|M14 9.2h4M14 12h4M14 14.8h2.6',\n    sante:'M12 20s-6.6-4.1-6.6-9A3.7 3.7 0 0 1 12 8.2 3.7 3.7 0 0 1 18.6 11c0 4.9-6.6 9-6.6 9z',\n    logement:'M4 11 12 4l8 7|M6.5 9.4V20h11V9.4|M10.4 20v-5h3.2v5',\n    vehicule:'M5 11l1.5-4.4A2 2 0 0 1 8.4 5.2h7.2a2 2 0 0 1 1.9 1.4L19 11|M3.6 11h16.8v5h-2.2M3.6 11v5h2.2M7.2 16a1.5 1.5 0 1 0 .01 0M16.8 16a1.5 1.5 0 1 0 .01 0',\n    argent:'M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z|M3 9.5h18|M16 13.4a1 1 0 1 0 0-2 1 1 0 0 0 0 2',\n    famille:'M9 11.2a3 3 0 1 0 0-6 3 3 0 0 0 0 6|M3.2 20c0-3 2.7-4.8 5.8-4.8s5.8 1.8 5.8 4.8|M16 5.6a3 3 0 0 1 0 5.6|M17.2 15.4c2.2.5 3.8 2 3.8 4.6',\n    shield:'M12 3l7.6 2.8v5.6c0 4.7-3.2 7.8-7.6 8.9-4.4-1.1-7.6-4.2-7.6-8.9V5.8z',\n    search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z|M20.5 20.5 16 16',\n    plus:'M12 5.2v13.6M5.2 12h13.6',\n    bell:'M18 9.5a6 6 0 1 0-12 0c0 6-2.4 7-2.4 7h16.8S18 15.5 18 9.5z|M10.4 20a2 2 0 0 0 3.2 0',\n    back:'M14.5 19l-7-7 7-7',\n    clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z|M12 7.4V12l3.2 2',\n    trash:'M4.5 7h15|M9 7V4.6h6V7|M6.8 7l1 12.4h8.4l1-12.4',\n    edit:'M4 20.5h4.2L20.2 8.5a1.9 1.9 0 0 0 0-2.8l-1.4-1.4a1.9 1.9 0 0 0-2.8 0L4 16.3z',\n    check:'M5 12.6l4.6 4.6L19.2 7',\n    chev:'M9.5 6l6 6-6 6',\n    gem:'M12 3l5.2 5L12 21 6.8 8z|M6.8 8h10.4|M9.6 4.6 8 8l4 13 4-13-1.6-3.4',\n    star:'M12 4l1.9 5.6L20 11l-6.1 1.4L12 18l-1.9-5.6L4 11l6.1-1.4z',\n    wallet:'M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z|M3 9.5h18|M16 13.4a1 1 0 1 0 0-2 1 1 0 0 0 0 2',\n    trend:'M4 16.5 9.5 11l3.4 3.4L20 7|M15.5 7H20v4.5',\n  };\n\n  componentDidMount(){ this.buildTypes(); this.load(); this.syncFinance(); }\n  componentDidUpdate(){ this.syncFinance(); }\n  componentWillUnmount(){\n    try{ if(this._cbNode && window.ECRIN_CB) window.ECRIN_CB.unmount(); }catch(e){}\n    try{ if(this._invNode && window.ECRIN_INV) window.ECRIN_INV.unmount(); }catch(e){}\n  }\n\n  // ECRIN: monte/démonte les modules finance dans des hôtes stables que React\n  // laisse intacts (il ne rend aucun enfant dans #cb-host / #inv-host). Un seul\n  // module est monté à la fois → aucune collision d'id entre les deux outils.\n  syncFinance(){\n    const v=this.state.view;\n    try{\n      if(v==='cb'){ const el=document.getElementById('cb-host'); if(el && window.ECRIN_CB && this._cbNode!==el){ this._cbNode=el; window.ECRIN_CB.mount(el); } }\n      else if(this._cbNode){ if(window.ECRIN_CB) window.ECRIN_CB.unmount(); this._cbNode=null; }\n    }catch(e){ console.error('cb mount/unmount',e); }\n    try{\n      if(v==='inv'){ const el=document.getElementById('inv-host'); if(el && window.ECRIN_INV && this._invNode!==el){ this._invNode=el; window.ECRIN_INV.mount(el); } }\n      else if(this._invNode){ if(window.ECRIN_INV) window.ECRIN_INV.unmount(); this._invNode=null; }\n    }catch(e){ console.error('inv mount/unmount',e); }\n  }\n\n  buildTypes(){ this.T = {}; for(const g of this.TYPE_GROUPS){ for(const t of g.types){ this.T[t[0]] = {label:t[1], collId:g.collId}; } } }\n\n  iso(off){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+off); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+da; }\n\n  seed(){\n    return { profile:{name:''}, docs:[\n      {id:'d1', typeId:'passeport', collId:'identite', title:'Passeport', holder:'Camille Laurent', number:'19FR84021', expiry:this.iso(35), note:'', createdAt:Date.now()-1000},\n      {id:'d2', typeId:'asshab', collId:'logement', title:'Assurance habitation', holder:'MAIF', number:'Contrat 4471102', expiry:this.iso(12), note:'Appartement rue des Lilas', createdAt:Date.now()-2000},\n      {id:'d3', typeId:'assauto', collId:'vehicule', title:'Assurance auto — Clio', holder:'Direct Assurance', number:'', expiry:this.iso(-4), note:'À renouveler, paiement en attente', createdAt:Date.now()-3000},\n      {id:'d4', typeId:'ct', collId:'vehicule', title:'Contrôle technique', holder:'Renault Clio 2018', number:'', expiry:this.iso(88), note:'', createdAt:Date.now()-4000},\n      {id:'d5', typeId:'cni', collId:'identite', title:'Carte d’identité', holder:'Camille Laurent', number:'', expiry:this.iso(430), note:'', createdAt:Date.now()-5000},\n      {id:'d6', typeId:'permis', collId:'identite', title:'Permis de conduire', holder:'Camille Laurent', number:'', expiry:'', note:'Catégorie B', createdAt:Date.now()-6000},\n      {id:'d7', typeId:'vitale', collId:'sante', title:'Carte Vitale', holder:'Camille Laurent', number:'1 84 06 75 116 023', expiry:'', note:'', createdAt:Date.now()-7000},\n      {id:'d8', typeId:'mutuelle', collId:'sante', title:'Mutuelle', holder:'Alan', number:'', expiry:this.iso(210), note:'', createdAt:Date.now()-8000},\n      {id:'d9', typeId:'grise', collId:'vehicule', title:'Carte grise', holder:'Renault Clio', number:'AB-123-CD', expiry:'', note:'', createdAt:Date.now()-9000},\n      {id:'d10', typeId:'bail', collId:'logement', title:'Bail de location', holder:'Agence Foncia', number:'', expiry:this.iso(300), note:'', createdAt:Date.now()-10000},\n      {id:'d11', typeId:'travail', collId:'argent', title:'Contrat de travail', holder:'Studio Vega', number:'', expiry:'', note:'CDI depuis 2021', createdAt:Date.now()-11000},\n      {id:'d12', typeId:'rib', collId:'argent', title:'RIB — compte courant', holder:'Boursorama', number:'FR76 3000 4002', expiry:'', note:'', createdAt:Date.now()-12000},\n      {id:'d13', typeId:'impots', collId:'argent', title:'Avis d’imposition 2025', holder:'', number:'', expiry:'', note:'', createdAt:Date.now()-13000},\n    ]};\n  }\n\n  load(){ let s=null; try{ s=JSON.parse(localStorage.getItem(this.KEY)); }catch(e){} if(!s || !Array.isArray(s.docs)){ s=this.seed(); this.write(s); } this.store=s; this.syncIdentity(); this.setState({loaded:true}); }\n  write(s){ try{ localStorage.setItem(this.KEY, JSON.stringify(s)); }catch(e){} }\n  persist(){ this.write(this.store); }\n\n  // ECRIN: maintient la clé d'identité unifiée (D5) à partir du profil du socle.\n  syncIdentity(){ try{ const n=(this.store.profile&&this.store.profile.name)||''; localStorage.setItem(this.IDKEY, JSON.stringify({name:n})); }catch(e){} }\n\n  collById(id){ return this.COLLS.find(c=>c.id===id) || this.COLLS[this.COLLS.length-1]; }\n  finById(id){ return this.FIN.find(c=>c.id===id) || null; }\n  typeLabel(id){ return (this.T[id]||{}).label || id; }\n  daysLeft(exp){ if(!exp) return null; const t=new Date(); t.setHours(0,0,0,0); const d=new Date(exp+'T00:00:00'); return Math.round((d-t)/86400000); }\n  whenLabel(d){ if(d==null) return ''; if(d<0) return 'Retard '+(-d)+'j'; if(d===0) return \"Aujourd’hui\"; if(d===1) return 'Demain'; return 'Dans '+d+'j'; }\n  whenColor(d){ if(d==null) return '#948c7e'; if(d<0) return '#d2553c'; if(d<=14) return '#b9810f'; return '#1f8a5b'; }\n  fmtDate(exp){ if(!exp) return ''; const d=new Date(exp+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }\n  fmtDateShort(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }\n  eur(n){ if(n==null||isNaN(n)) return '—'; return Math.round(n).toLocaleString('fr-FR')+' €'; }\n  eur2(n){ if(n==null||isNaN(n)) return '—'; return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }\n  icon(name,color,size){ const d=this.ICONS[name]||''; const ps=d.split('|').map((p,i)=>React.createElement('path',{d:p,key:i})); return React.createElement('svg',{viewBox:'0 0 24 24',fill:'none',stroke:color||'currentColor',strokeWidth:1.7,strokeLinecap:'round',strokeLinejoin:'round',width:size||20,height:size||20,style:{display:'block',flex:'none'}}, ps); }\n\n  go(view, extra){ this.setState(Object.assign({view, q:''}, extra||{})); }\n  home(){ this.go('home',{collId:null,docId:null}); }\n  openColl(id){ this.go('coll',{collId:id, docId:null}); }\n  openDoc(id){ this.go('doc',{docId:id}); }\n  openFin(id){ this.go(id,{collId:null,docId:null}); }\n  settings(){ this.go('settings'); }\n\n  toastMsg(m){ this.setState({toast:m}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),2400); }\n\n  startAdd(){ this.setState({form:{mode:'add', type:null}}); }\n  chooseType(id){ const t=this.T[id]; this.setState({form:{mode:'add', type:id, collId:t.collId, title:'', holder:'', number:'', expiry:'', note:''}}); }\n  startEdit(){ const d=this.activeDoc(); if(!d) return; this.setState({form:{mode:'edit', id:d.id, type:d.typeId, collId:d.collId, title:d.title, holder:d.holder||'', number:d.number||'', expiry:d.expiry||'', note:d.note||''}}); }\n  setField(e){ const f=e.target.dataset.field; const v=e.target.value; this.setState(s=>({form:Object.assign({}, s.form, {[f]:v})})); }\n  cancelForm(){ this.setState({form:null}); }\n  saveForm(){ const f=this.state.form; if(!f||!f.type) return; const title=(f.title||'').trim()||this.typeLabel(f.type);\n    if(f.mode==='edit'){ const d=this.store.docs.find(x=>x.id===f.id); if(d){ Object.assign(d,{title, holder:f.holder, number:f.number, expiry:f.expiry, note:f.note, typeId:f.type, collId:f.collId}); } this.persist(); this.setState({form:null}); this.toastMsg('Document mis à jour'); }\n    else { const id='d'+Date.now(); this.store.docs.unshift({id, typeId:f.type, collId:f.collId, title, holder:f.holder, number:f.number, expiry:f.expiry, note:f.note, createdAt:Date.now()}); this.persist(); this.setState({form:null, view:'doc', docId:id, q:''}); this.toastMsg('Document ajouté'); }\n  }\n  removeDoc(){ const d=this.activeDoc(); if(!d) return; if(!confirm('Supprimer « '+d.title+' » ?')) return; this.store.docs=this.store.docs.filter(x=>x.id!==d.id); this.persist(); this.home(); this.toastMsg('Document supprimé'); }\n  activeDoc(){ return this.store ? this.store.docs.find(d=>d.id===this.state.docId) : null; }\n\n  onSearch(e){ this.setState({q:e.target.value}); }\n  accentFor(n){ const pal=['#b3892f','#2b6cd9','#1f8a5b','#c0563a','#7a4fb5','#1c8c84','#b03f6e','#5a6b2f']; n=(n||'').trim(); if(!n) return '#b3892f'; let s=0; for(let i=0;i<n.length;i++) s+=n.charCodeAt(i); return pal[s%pal.length]; }\n  setNameDraft(e){ this.setState({nameDraft:e.target.value}); }\n  submitName(){ const n=(this.state.nameDraft||'').trim(); if(!n) return; this.store.profile=this.store.profile||{}; this.store.profile.name=n; this.persist(); this.syncIdentity(); this.setState({welcome:false, nameDraft:''}); this.toastMsg('Bienvenue, '+n+' !'); }\n  changeName(){ this.setState({welcome:true, nameDraft:(this.store.profile&&this.store.profile.name)||''}); }\n  resetDemo(){ const s=this.seed(); this.store=s; this.write(s); this.syncIdentity(); this.home(); this.toastMsg('Exemples rechargés'); }\n  clearAll(){ if(!confirm('Tout effacer ? Les exemples partiront aussi.')) return; const s={profile:(this.store&&this.store.profile)||{name:''}, docs:[]}; this.store=s; this.write(s); this.syncIdentity(); this.home(); this.toastMsg('Écrin vidé'); }\n\n  // ECRIN: agrège les signaux finance des deux modules (API lecture seule).\n  finSignals(){\n    const self=this, raw=[]; let cb=null, inv=null;\n    try{ if(window.ECRIN_CB) cb=window.ECRIN_CB.getSignals(); }catch(e){}\n    try{ if(window.ECRIN_INV) inv=window.ECRIN_INV.getSignals(); }catch(e){}\n    if(cb){\n      raw.push({label:'Solde du mois', value:this.eur2(cb.soldeMois), tone:(cb.soldeMois>=0?'#1f8a5b':'#d2553c'), accent:'#1f8a5b', icon:'wallet', open:()=>this.openFin('cb')});\n      raw.push({label:'Budget variable restant', value:this.eur(cb.budgetRestant), tone:(cb.budgetRestant>=0?'#211d17':'#d2553c'), accent:'#1f8a5b', icon:'check', open:()=>this.openFin('cb')});\n      if(cb.prochainPrelevement){ const p=cb.prochainPrelevement; raw.push({label:'Prochain prélèvement', value:this.eur(Math.abs(p.amount)), sub:(p.label||'')+' · '+this.fmtDateShort(p.date), tone:'#b9810f', accent:'#b9810f', icon:'clock', open:()=>this.openFin('cb')}); }\n      else if(cb.decouvertJours){ raw.push({label:'Jours à découvert (mois)', value:cb.decouvertJours+' j', tone:'#d2553c', accent:'#d2553c', icon:'clock', open:()=>this.openFin('cb')}); }\n    }\n    if(inv){\n      raw.push({label:'Profil investisseur', value:(inv.profil||'À découvrir'), tone:'#b3892f', accent:'#b3892f', icon:'gem', open:()=>this.openFin('inv')});\n      if(inv.allocationCible){ const a=inv.allocationCible; raw.push({label:'Allocation cible', value:a.actions+'% actions', sub:a.obligations+'% obligations · '+a.or+'% or', tone:'#211d17', accent:'#b3892f', icon:'trend', open:()=>this.openFin('inv')}); }\n      else { raw.push({label:'Allocation cible', value:'À définir', sub:'Fais le quiz profil', tone:'#948c7e', accent:'#b3892f', icon:'trend', open:()=>this.openFin('inv')}); }\n    }\n    return raw.map((s,i)=>({ key:'fs'+i, label:s.label, value:s.value, tone:s.tone, accent:s.accent, accentSoft:s.accent+'1c', iconEl:self.icon(s.icon,s.accent,16), sub:s.sub||'', hasSub:!!s.sub, open:s.open }));\n  }\n\n  renderVals(){\n    const self=this, S=this.state;\n    if(!S.loaded || !this.store) return { ready:false };\n    const docs=this.store.docs||[];\n    const navBase='display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;font-family:inherit;';\n    const on='background:rgba(30,26,18,.09);border-color:rgba(30,26,18,.11);color:#211d17;';\n    const off='background:transparent;color:#6e675b;';\n\n    const mk=(d)=>{ const c=self.collById(d.collId); const dl=self.daysLeft(d.expiry); return {\n      raw:d, id:d.id, title:d.title, typeLabel:self.typeLabel(d.typeId),\n      collLabel:c.label, accent:c.accent, tint:c.accent+'22', soft:c.accent+'14', border:c.accent+'66',\n      iconEl:self.icon(c.icon,c.accent,18),\n      sub:d.holder||'', hasSub:!!d.holder,\n      dl, when:self.whenLabel(dl), whenColor:self.whenColor(dl),\n      open:()=>self.openDoc(d.id) }; };\n    const items=docs.map(mk);\n\n    const reminders=items.filter(x=>x.dl!=
